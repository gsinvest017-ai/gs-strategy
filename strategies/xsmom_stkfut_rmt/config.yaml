  # Slippage stays at 6.0 (= M15). FixedSlippage applies a single `spread` in
  # the asset's price units, so for TX (index ~17000) 6 pts = 0.035% per side
  # while for a 100 NTD stock-future 6 NTD/share = 6% per side. This mismatch
  # already over-charges stock-futures slippage; bumping to 8.0 was tested in
  # M17 and produced a non-linear 4 pp CAGR worsening that dominates the cost-
  # realistic commission story. Documented as a known structural limitation
  # (FixedSlippage cannot differ by asset); proper fix requires a per-root
  # VolumeShareSlippage or a custom slippage model — out of M17 scope.
  spread_points: 6.0
  # benchmark omitted: IR0001 is in `tquant` bundle, not `tquant_future`.
