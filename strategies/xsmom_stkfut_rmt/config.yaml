    - DNF  # 2884 玉山金
    - DOF  # 2885 元大金
    - DPF  # 2892 第一金
    - DQF  # 3481 群創
    - DSF  # 2353 宏碁
    - DUF  # 2448 晶電
    - PUF  # 2454 聯發科
    - DWF  # 2915 潤泰全
    - DXF  # 3231 緯創
    - DYF  # 1102 亞泥
    - DZF  # 1210 大成
    - EEF  # 1312 國喬
    - EGF  # 1314 中石化
    - EHF  # 1319 東陽
    - EKF  # 1440 南紡
    - EMF  # 1504 東元
    - EOF  # 1560 中砂
    - EPF  # 1590 亞德客-KY
    - ERF  # 1702 南僑
    - EYF  # 1718 中纖
    - EZF  # 1722 台肥
    - FBF  # 2006 東和鋼鐵
    - FCF  # 2014 中鴻
    - FEF  # 2027 大成鋼
    - QMF  # 2049 上銀
    - SVF  # 2059 川湖
    - FKF  # 2105 正新
  universe_start: '2020-01-01'
  universe_end:   '2026-04-30'

  lookback: 126        # 6-month formation
  skip: 21             # skip last month
  long_decile: 0.10
  short_decile: 0.10
  gross_target: 1.0    # gross exposure target = 100% (50% long + 50% short)

  rmt_window: 60       # rolling correlation window for complexity gap
  # M10 calibration (2026-05-14): empirical gap distribution over 2020-2026 on
  # the 30-root TX-stockfut universe has mean=0.050, std=0.015, max=0.097, so
  # the paper's 0.20 / 0.05 thresholds (sized for G5 50+ assets) make the
  # strategy permanently sub-full. We rescale to observed percentiles.
  # M15 recalibration (2026-05-21): with M14's 60-root universe the gap
  # distribution shifted left (mean=0.042, std=0.011, max=0.069). The 30-root
  # thresholds (0.058/0.045) over-restrict the new universe: regime_scale
  # collapses to 62% zero / 27% half / 11% full vs the intended ~quartile mix.
  # Rescale again to the 60-root universe's empirical percentiles:
  #   p75 ≈ 0.049 -> full position (top quartile = "structurally rich")
  #   p33 ≈ 0.037 -> de-risk to zero (bottom third = panic synchronisation)
  # See docs/progress-xsmom-beta-hedge.md M14/M15 for the dual distribution.
  rmt_threshold: 0.049     # M15: 60-root p75 (was 0.058 = 30-root p75)
  rmt_low_threshold: 0.037 # M15: 60-root p33 (was 0.045 = 30-root p33)

  min_universe: 20     # below this number of available stock futures, skip
  hedge_with_tx: true  # master switch; off => no TX hedge at all

  # M13 beta-neutral hedge (2026-05-19). M11 ablation revealed the original
  # dollar-net hedge is identically zero under a balanced L/S book
  # (sum of long weights + sum of short weights ≈ 0). To actually hedge market
  # beta, set beta_neutral_hedge=true: at each rebalance the strategy estimates
  # each stock-future's beta to TX over the last `beta_window` days via OLS,
  # then orders TX with target weight = -sum(w_i * beta_i). The TX leg is
  # clipped to ±2.0 portfolio weight so a regime shock can't blow up margin.
  beta_neutral_hedge: true
  beta_window: 60      # rolling OLS lookback (trading days) for per-asset beta

  days_before_close: 10

  # M17 cost calibration (2026-05-23). Per zipline.finance.commission.PerContract
  # source (.venv-bt/.../commission.py:123), `cost` is applied **per side**
  # (transaction.amount * cost_per_unit), and roots NOT in the map fall back to
  # DEFAULT_PER_CONTRACT_COST = 0.85 (USD, originally). Before M17 the 60 stock-
  # futures roots had no entry => they traded at ~0.85 NTD/side (essentially
  # free). M17 explicitly maps every traded root using realistic Taiwan broker +
  # 期交稅 (transaction tax 0.00002 of contract value) figures:
  #
  #   TX:   broker ~80 + tax ~70 (= 17000pt * 200/pt * 0.00002)  ->  150 NTD/side
  #   MTX:  broker ~40 + tax ~17 (= 17000pt *  50/pt * 0.00002)  ->   60 NTD/side
  #   stockfut: broker ~110 + tax ~10 (~300K notional)           ->  120 NTD/side
  #
  # (M14 doc note: "台股個股期約 110-120 NTD/口 + 0.002% 交易稅")
  per_contract_cost:
    TX: 150
    MTX: 60
    # Stock futures (all 60 roots ingested in M14 bundle). Same 120 NTD/side
    # applied uniformly — per-root broker discounts not modelled.
    CAF: 120  # 1303 南亞
    CBF: 120  # 2002 中鋼
    CCF: 120  # 2303 聯電
    QFF: 120  # 2330 TSMC
    CEF: 120  # 2881 富邦金
    CFF: 120  # 1301 台塑
    CGF: 120  # 2324 仁寶
    CHF: 120  # 2409 友達
    CJF: 120  # 2880 華南金
    CKF: 120  # 2882 國泰金
    CLF: 120  # 2886 兆豐金
    CMF: 120  # 2887 台新金
    CNF: 120  # 2891 中信金
    CQF: 120  # 1216 統一
    CRF: 120  # 1402 遠東新
    CSF: 120  # 1605 華新
    CUF: 120  # 2323 中環
    CWF: 120  # 2352 佳世達
    CXF: 120  # 2371 大同
    CYF: 120  # 2408 南科
    CZF: 120  # 2603 長榮
    DAF: 120  # 2609 陽明
    DBF: 120  # 2610 華航
    DCF: 120  # 2801 彰銀
    DDF: 120  # 2888 新光金
    DEF: 120  # 2890 永豐金
    DFF: 120  # 1101 台泥
    DGF: 120  # 1326 台化
    DHF: 120  # 2317 鴻海
    DIF: 120  # 2337 旺宏
    QRF: 120  # 2357 華碩
    DKF: 120  # 2382 廣達
    DLF: 120  # 2412 中華電
    DNF: 120  # 2884 玉山金
    DOF: 120  # 2885 元大金
    DPF: 120  # 2892 第一金
    DQF: 120  # 3481 群創
    DSF: 120  # 2353 宏碁
    DUF: 120  # 2448 晶電
    PUF: 120  # 2454 聯發科
    DWF: 120  # 2915 潤泰全
    DXF: 120  # 3231 緯創
    DYF: 120  # 1102 亞泥
    DZF: 120  # 1210 大成
    EEF: 120  # 1312 國喬
    EGF: 120  # 1314 中石化
    EHF: 120  # 1319 東陽
    EKF: 120  # 1440 南紡
    EMF: 120  # 1504 東元
    EOF: 120  # 1560 中砂
