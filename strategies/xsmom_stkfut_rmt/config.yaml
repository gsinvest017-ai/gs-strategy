# Cross-sectional momentum on Taiwan single-stock futures, gated by RMT regime
# References:
#   arxiv 2604.19107 (RMT Complexity Gap, Mukhia et al. 2026)
#   Jegadeesh & Titman 1993 (cross-sectional momentum)

start: '2020-01-01'
end:   '2026-04-30'
capital_base: 30_000_000
bundle: tquant_future
# calendar omitted -> runner defaults to TEJ_morning_future.

params:
  # M14 (2026-05-20): expanded from 30 -> 60 roots. Bundle ingested at
  # ~/.zipline/data/tquant_future/2026-05-19T16;01;16.781143 covers
  # TX + MTX + top-60 stock-futures from data/stock_futures_universe.json.
  # Auto-discover (universe_roots empty) would pick 257 roots and raise
  # SymbolNotFound on those not ingested, so we hard-pin to what is available.
  universe_roots:
    - CAF  # 1303 南亞
    - CBF  # 2002 中鋼
    - CCF  # 2303 聯電
    - QFF  # 2330 TSMC
    - CEF  # 2881 富邦金
    - CFF  # 1301 台塑
    - CGF  # 2324 仁寶
    - CHF  # 2409 友達
    - CJF  # 2880 華南金
    - CKF  # 2882 國泰金
    - CLF  # 2886 兆豐金
    - CMF  # 2887 台新金
    - CNF  # 2891 中信金
    - CQF  # 1216 統一
    - CRF  # 1402 遠東新
    - CSF  # 1605 華新
    - CUF  # 2323 中環
    - CWF  # 2352 佳世達
    - CXF  # 2371 大同
    - CYF  # 2408 南科
    - CZF  # 2603 長榮
    - DAF  # 2609 陽明
    - DBF  # 2610 華航
    - DCF  # 2801 彰銀
    - DDF  # 2888 新光金
    - DEF  # 2890 永豐金
    - DFF  # 1101 台泥
    - DGF  # 1326 台化
    - DHF  # 2317 鴻海
    - DIF  # 2337 旺宏
    - QRF  # 2357 華碩
    - DKF  # 2382 廣達
    - DLF  # 2412 中華電
    - DNF  # 2884 玉山金
    - DOF  # 2885 元大金
    - DPF  # 2892 第一金
    - DQF  # 3481 群創
    - DSF  # 2353 宏碁
    - DUF  # 2448 晶電
    - PUF  # 2454 聯發科
    - DWF  # 2915 潤泰全
    - DXF  # 3231 緯創
    - DYF  # 1102 亞泥
    - DZF  # 1210 大成
    - EEF  # 1312 國喬
    - EGF  # 1314 中石化
    - EHF  # 1319 東陽
    - EKF  # 1440 南紡
    - EMF  # 1504 東元
    - EOF  # 1560 中砂
    - EPF  # 1590 亞德客-KY
    - ERF  # 1702 南僑
    - EYF  # 1718 中纖
    - EZF  # 1722 台肥
    - FBF  # 2006 東和鋼鐵
    - FCF  # 2014 中鴻
    - FEF  # 2027 大成鋼
    - QMF  # 2049 上銀
    - SVF  # 2059 川湖
    - FKF  # 2105 正新
  universe_start: '2020-01-01'
  universe_end:   '2026-04-30'

  lookback: 126        # 6-month formation
  skip: 21             # skip last month
  long_decile: 0.10
  short_decile: 0.10
  gross_target: 1.0    # gross exposure target = 100% (50% long + 50% short)

  rmt_window: 60       # rolling correlation window for complexity gap
  # M10 calibration (2026-05-14): empirical gap distribution over 2020-2026 on
  # the 30-root TX-stockfut universe has mean=0.050, std=0.015, max=0.097, so
  # the paper's 0.20 / 0.05 thresholds (sized for G5 50+ assets) make the
  # strategy permanently sub-full. We rescale to observed percentiles:
  #   p75 ≈ 0.058 -> full position (top quartile = "structurally rich")
  #   p33 ≈ 0.045 -> de-risk to zero (bottom third = panic synchronisation)
  # See docs/backtest-results-2026-05-13-xsmom.md for the original distribution
  # and docs/progress-bt-integration.md M10 for re-run metrics.
  rmt_threshold: 0.058     # gap >= 0.058 -> full position (p75 of empirical)
  rmt_low_threshold: 0.045 # gap below this -> de-risk to zero (p33)

  min_universe: 20     # below this number of available stock futures, skip
  hedge_with_tx: true  # master switch; off => no TX hedge at all

  # M13 beta-neutral hedge (2026-05-19). M11 ablation revealed the original
  # dollar-net hedge is identically zero under a balanced L/S book
  # (sum of long weights + sum of short weights ≈ 0). To actually hedge market
  # beta, set beta_neutral_hedge=true: at each rebalance the strategy estimates
  # each stock-future's beta to TX over the last `beta_window` days via OLS,
  # then orders TX with target weight = -sum(w_i * beta_i). The TX leg is
  # clipped to ±2.0 portfolio weight so a regime shock can't blow up margin.
  beta_neutral_hedge: true
  beta_window: 60      # rolling OLS lookback (trading days) for per-asset beta

  days_before_close: 10

  per_contract_cost:
    TX: 200
    MTX: 100
    # Stock futures default 100 NTD/contract; tune per broker
  spread_points: 6.0
  # benchmark omitted: IR0001 is in `tquant` bundle, not `tquant_future`.
