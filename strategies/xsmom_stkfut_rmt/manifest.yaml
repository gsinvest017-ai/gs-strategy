id: xsmom_stkfut_rmt
name: XSMOM on TW Stock Futures (RMT-gated)
description: |
  Cross-sectional 6-1 momentum on 60 Taiwan single-stock futures, regime-gated
  by a Random-Matrix-Theory "complexity gap" filter. Long top decile / short
  bottom decile, monthly rebalanced. The complexity gap (lambda_max - mean
  off-diagonal correlation) sizes the book between zero / half / full. M13
  adds a beta-neutral TX hedge layer. Empirically confirmed null alpha on
  2020-2026 — see docs/progress-xsmom-beta-hedge.md.
  Papers: Mukhia et al. (2026) arXiv:2604.19107; Jegadeesh & Titman (1993).
