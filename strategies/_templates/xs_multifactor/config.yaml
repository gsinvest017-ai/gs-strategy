# Cross-sectional multi-factor equity long-short (topN) template
# Upstream: Factor--FORGE factors + gs-MINT tournament survivors
# Spec: ~/gs-zipline-tej/docs/strategy-import-spec.md v1.2
#       strategy_form: xs_multifactor

start: '2019-01-01'
end:   '2026-04-30'
capital_base: 10_000_000
bundle: tquant               # equity bundle
calendar: TEJ_XTAI           # explicit for equity

params:
  strategy_form: xs_multifactor
  rebalance: monthly         # daily | weekly | monthly (spec v1.2)
  universe_source: quantdata # '' (關閉) | 'quantdata' → gold/features price canonical
  universe_as_of: null       # 建議設在 backtest start 之前（PIT 安全）；null → 今天
  universe_top_n: 200
  symbols: []                # 覆寫用：非空則忽略 universe_source
  n_long: 10                 # long bucket size (top-N by composite score)
  n_short: 0                 # 0 -> long-only; >0 -> short leg
  weighting: equal           # equal | factor_proportional (TODO)
  signals: []                # factor pool ids consumed (spec v1.2 signals:)
  price_floor: 10.0          # 排除低價股
  liquidity_floor_ntd: 20_000_000   # 流動性下限：trailing 均值成交額（NT$）
  liquidity_window: 20       # 流動性回看交易日數
  benchmark: IR0001          # 需同時 ingest tquant bundle
