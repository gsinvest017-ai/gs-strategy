id: tsmom_tx_mtx
name: TSMOM on TX & MTX Futures
description: |
  Volatility-targeted time-series momentum on TX + MTX continuous futures.
  Canonical 12-1 lookback: sign of (log-return over last 252 days, skipping
  the most recent 21) sets direction; weight = sign * target_vol / EWMA_sigma
  per leg, capped at max_gross_leverage. Both long & short.
  References: Moskowitz/Ooi/Pedersen (2012); Wiley JFM fut.70093 (2026).
